[package]
name = "euvd-rs"
version = "0.1.0"
edition = "2024"
description = "Terminal UI for the ENISA EU Vulnerability Database (EUVD)"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ratatui = "0.30.2"
ureq = "3.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
insta = "1.48.0"
